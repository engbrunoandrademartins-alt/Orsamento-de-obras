<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ObraCerta — Orçamento de Obras · CTOSM/SMS Cuiabá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   INTEGRAÇÃO DOS SISTEMAS CTOSM  (mesmo bloco nos 3 sistemas)
   Orçamentos (ObraCerta) · Projetos/Relatório de Obras · Controle de Empenhos
   Vínculo: tabela obra_vinculos (projeto Supabase de orçamentos/empenhos)
   obra_id (Relatório de Obras) → contrato_id (Empenhos) + orcamento_ids (ObraCerta)
   ===================================================================== */
(function(){
  const CQ_URL = 'https://cqopgqmsjwfczhbiishj.supabase.co', CQ_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxb3BncW1zandmY3poYmlpc2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDM5MzAsImV4cCI6MjEwNDIxOTkzMH0.O3HuqHax9u2ZEdW4gpodbfPxWU05Sujg94L2SicfmbI';
  const RL_URL = 'https://vvcyfdgadvacfiqlltly.supabase.co', RL_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2Y3lmZGdhZHZhY2ZpcWxsdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MjMyNTYsImV4cCI6MjEwNDI5OTI1Nn0.3jX0wWv0uHqOKEPcogQmqxDOD3NvOrpK-h8FRtL4llE';
  const LINKS = {
    orc: 'https://engbrunoandrademartins-alt.github.io/Orsamento-de-obras/',
    rel: 'https://engbrunoandrademartins-alt.github.io/ctdo-relatorio-obras/',
    emp: 'https://engbrunoandrademartins-alt.github.io/controle-empenhos-cuiaba/'
  };
  let cq = null, rl = null;
  function cli(){
    if (!window.supabase || !window.supabase.createClient) throw new Error('Supabase indisponível');
    if (!cq) cq = window.supabase.createClient(CQ_URL, CQ_KEY, { auth:{ persistSession:false, storageKey:'ctosm-cq' } });
    if (!rl) rl = window.supabase.createClient(RL_URL, RL_KEY, { auth:{ persistSession:false, storageKey:'ctosm-rl' } });
  }
  const e = s => (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const money = v => (Number(v) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  const pct = (a, b) => b > 0 ? ((a / b) * 100).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + '%' : '—';
  const chk = r => { if (r.error) throw r.error; return r.data || []; };

  // ---------- estilo (prefixo ctosm-) ----------
  const css = `
  .ctosm-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#0f2e1f;color:#cfe7d8;font:12.5px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:6px 14px;position:relative;z-index:50}
  .ctosm-bar b{color:#fff;font-weight:600;margin-right:6px;letter-spacing:.2px}
  .ctosm-bar a{color:#cfe7d8;text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
  .ctosm-bar a:hover{background:rgba(255,255,255,.08);color:#fff}
  .ctosm-bar a.on{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
  .ctosm-card{border:1px solid #d7e3dc;border-radius:10px;padding:14px 16px;background:#fff;margin:14px 0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d2b24}
  .ctosm-card h3{margin:0 0 4px;font-size:15px}
  .ctosm-card .mut{color:#5d6f66;font-size:12.5px}
  .ctosm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
  .ctosm-kpi{border:1px solid #e3ece7;border-radius:8px;padding:8px 10px;background:#f7faf8}
  .ctosm-kpi span{display:block;font-size:11.5px;color:#5d6f66}
  .ctosm-kpi b{font-size:15px;font-variant-numeric:tabular-nums}
  .ctosm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .ctosm-row select{flex:1;min-width:220px;padding:7px 9px;border:1px solid #c9d8cf;border-radius:7px;font:inherit;background:#fff}
  .ctosm-btn{padding:7px 12px;border-radius:7px;border:1px solid #2f8f5b;background:#2f8f5b;color:#fff;font:inherit;cursor:pointer}
  .ctosm-btn.sec{background:#fff;color:#2f8f5b}
  .ctosm-list{margin:6px 0 0;padding:0;list-style:none}
  .ctosm-list li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid #eef3f0;padding:6px 0}
  .ctosm-list a,.ctosm-card a{color:#1f7a4a}
  .ctosm-tag{font-size:11px;background:#e7f3ec;color:#1f7a4a;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .ctosm-chk{display:flex;gap:6px;align-items:center;padding:3px 0}
  @media print{.ctosm-bar,.ctosm-card{display:none!important}}`;
  function injectCss(){ if (document.getElementById('ctosm-css')) return; const s = document.createElement('style'); s.id = 'ctosm-css'; s.textContent = css; document.head.appendChild(s); }

  // ---------- barra de navegação entre os sistemas ----------
  function bar(atual){
    injectCss(); if (document.querySelector('.ctosm-bar')) return;
    const d = document.createElement('div'); d.className = 'ctosm-bar';
    d.innerHTML = `<b>Sistemas CTOSM</b>
      <a href="${LINKS.orc}" class="${atual === 'orc' ? 'on' : ''}">Orçamentos</a>
      <a href="${LINKS.rel}" class="${atual === 'rel' ? 'on' : ''}">Projetos e relatório de obras</a>
      <a href="${LINKS.emp}" class="${atual === 'emp' ? 'on' : ''}">Empenhos</a>`;
    document.body.prepend(d);
  }

  // ---------- dados ----------
  async function obras(){ cli(); return chk(await rl.from('obras').select('id,nome,status,endereco').order('nome')); }
  async function contratos(){ cli(); return chk(await cq.from('vw_emp_contrato_resumo').select('*').order('numero_contrato')); }
  async function orcs(){ cli(); return chk(await cq.from('vw_orc_resumo').select('*').eq('referencia', false).order('nome')); }
  async function vincs(){ cli(); return chk(await cq.from('obra_vinculos').select('*')); }
  async function projetosObra(obraId){ cli(); return chk(await rl.from('projetos').select('id,nome,categoria,storage_path,file_name,file_size,cad_path,cad_name,cad_size,orcamento_id,data_upload').eq('obra_id', obraId).order('nome')); }
  async function orcsDaObra(obraId){ const [vs, os] = await Promise.all([vincs(), orcs()]); const v = vs.find(x => x.obra_id === obraId); const ids = v ? (v.orcamento_ids || []) : []; return os.filter(o => ids.includes(o.id)); }
  const arqUrl = p => p ? 'https://vvcyfdgadvacfiqlltly.supabase.co/storage/v1/object/public/arquivos-obras/' + p.split('/').map(encodeURIComponent).join('/') : '';
  function listaProjetos(ps, orcId){
    if (!ps.length) return '<div class="mut">Nenhum projeto anexado a esta obra.</div>';
    const ord = ps.slice().sort((a, b) => ((b.orcamento_id === orcId) - (a.orcamento_id === orcId)));
    return `<ul class="ctosm-list">${ord.map(p => `<li><span>${e(p.nome || p.file_name || p.cad_name)} <span class="ctosm-tag">${e(p.categoria || 'Projeto')}</span>${orcId && p.orcamento_id === orcId ? ' <span class="ctosm-tag" style="background:#fff4d6;color:#8a5a00">deste orçamento</span>' : ''}</span>
      <span style="white-space:nowrap">${p.storage_path ? `<a href="${arqUrl(p.storage_path)}" target="_blank" rel="noopener">PDF ↗</a>` : ''}${p.storage_path && p.cad_path ? ' · ' : ''}${p.cad_path ? `<a href="${arqUrl(p.cad_path)}" target="_blank" rel="noopener">DWG ↓</a>` : ''}</span></li>`).join('')}</ul>`;
  }
  async function salvar(v){ cli(); v.atualizado_em = new Date().toISOString(); chk(await cq.from('obra_vinculos').upsert(v)); }
  // um orçamento pertence a uma obra só: retira dos outros vínculos
  async function soltarOrc(orcId, exceto){ const all = await vincs();
    for (const v of all) if (v.obra_id !== exceto && (v.orcamento_ids || []).includes(orcId)){ v.orcamento_ids = v.orcamento_ids.filter(x => x !== orcId); await salvar(v); } }

  function kpisContrato(c){
    if (!c) return '<div class="mut">Nenhum contrato vinculado.</div>';
    const saldo = (+c.valor_total || 0) - (+c.empenhado || 0);
    return `<div class="ctosm-grid">
      <div class="ctosm-kpi"><span>Contrato ${e(c.numero_contrato)} — ${e(c.credor)}</span><b>${money(c.valor_total)}</b></div>
      <div class="ctosm-kpi"><span>Empenhado (${pct(c.empenhado, c.valor_total)})</span><b>${money(c.empenhado)}</b></div>
      <div class="ctosm-kpi"><span>Notas lançadas / pago</span><b>${money(c.utilizado)} / ${money(c.pago)}</b></div>
      <div class="ctosm-kpi"><span>Saldo do contrato</span><b style="color:${saldo < 0 ? '#b42318' : 'inherit'}">${money(saldo)}</b></div></div>`;
  }
  function kpisOrcs(lista){
    if (!lista.length) return '<div class="mut">Nenhum orçamento vinculado.</div>';
    const tot = lista.reduce((s, o) => s + (+o.valor_final || 0), 0), med = lista.reduce((s, o) => s + (+o.medido_final || 0), 0);
    return `<div class="ctosm-grid"><div class="ctosm-kpi"><span>Valor orçado (${lista.length} orçamento${lista.length > 1 ? 's' : ''})</span><b>${money(tot)}</b></div>
      <div class="ctosm-kpi"><span>Medido acumulado (${pct(med, tot)})</span><b>${money(med)}</b></div>
      <div class="ctosm-kpi"><span>Saldo a medir</span><b>${money(tot - med)}</b></div></div>
      <ul class="ctosm-list">${lista.map(o => `<li><span>${e(o.nome)} <span class="ctosm-tag">${o.n_medicoes || 0} medição(ões)</span></span><a href="${LINKS.orc}?orc=${o.id}" target="_blank" rel="noopener">abrir orçamento ↗</a></li>`).join('')}</ul>`;
  }
  const erro = (el, err) => { el.innerHTML = `<div class="ctosm-card"><h3>Vínculos entre sistemas</h3><div class="mut">Não foi possível carregar os vínculos: ${e(err.message || err)}</div></div>`; };

  // ---------- painel na OBRA (Relatório de Obras): escolhe contrato e orçamentos ----------
  async function painelObra(el, obraId, obraNome){
    injectCss(); if (!el || !obraId) return; el.innerHTML = '<div class="ctosm-card"><div class="mut">Carregando vínculos…</div></div>';
    try {
      const [cs, os, vs] = await Promise.all([contratos(), orcs(), vincs()]);
      const v = vs.find(x => x.obra_id === obraId) || { obra_id:obraId, obra_nome:obraNome, contrato_id:null, orcamento_ids:[] };
      const outros = new Map(); vs.forEach(x => { if (x.obra_id !== obraId) (x.orcamento_ids || []).forEach(id => outros.set(id, x.obra_nome)); });
      const c = cs.find(x => x.id === v.contrato_id); const meus = os.filter(o => (v.orcamento_ids || []).includes(o.id));
      el.innerHTML = `<div class="ctosm-card"><h3>Orçamento e contrato desta obra</h3>
        <div class="mut">Liga esta obra ao orçamento (ObraCerta) e ao contrato/empenhos (Controle de Empenhos).</div>
        <div class="ctosm-row"><select id="ctosm-ctr"><option value="">— contrato (Controle de Empenhos) —</option>${cs.map(x => `<option value="${x.id}" ${x.id === v.contrato_id ? 'selected' : ''}>${e(x.numero_contrato)} — ${e(x.credor)}</option>`).join('')}</select>
          ${c ? `<a class="ctosm-btn sec" href="${LINKS.emp}?contrato=${c.id}" target="_blank" rel="noopener">abrir empenhos ↗</a>` : ''}</div>
        ${kpisContrato(c)}
        <details ${meus.length ? '' : 'open'}><summary style="cursor:pointer;margin:6px 0">Orçamentos vinculados (${meus.length}) — marcar/desmarcar</summary>
          <div style="max-height:220px;overflow:auto;border:1px solid #e3ece7;border-radius:8px;padding:6px 10px;margin:6px 0">${os.map(o => `<label class="ctosm-chk"><input type="checkbox" data-orc="${o.id}" ${(v.orcamento_ids || []).includes(o.id) ? 'checked' : ''}> ${e(o.nome)} <span class="mut">${money(o.valor_final)}${outros.has(o.id) ? ' · hoje em: ' + e(outros.get(o.id)) : ''}</span></label>`).join('') || '<div class="mut">Nenhum orçamento no ObraCerta.</div>'}</div></details>
        ${kpisOrcs(meus)}
        <div class="ctosm-row"><button class="ctosm-btn" id="ctosm-salvar">Salvar vínculos</button><span class="mut" id="ctosm-msg"></span></div></div>`;
      el.querySelector('#ctosm-salvar').onclick = async () => {
        const ids = [...el.querySelectorAll('[data-orc]')].filter(i => i.checked).map(i => i.dataset.orc);
        try { for (const id of ids) await soltarOrc(id, obraId);
          await salvar({ obra_id:obraId, obra_nome:obraNome, contrato_id:el.querySelector('#ctosm-ctr').value || null, orcamento_ids:ids });
          painelObra(el, obraId, obraNome); } catch(err){ el.querySelector('#ctosm-msg').textContent = 'Erro: ' + (err.message || err); } };
    } catch(err){ erro(el, err); }
  }

  // ---------- painel no ORÇAMENTO (ObraCerta): escolhe a obra e o contrato ----------
  async function painelOrc(el, orcId){
    injectCss(); if (!el || !orcId) return; el.innerHTML = '<div class="ctosm-card"><div class="mut">Carregando vínculos…</div></div>';
    try {
      const [obs, cs, vs] = await Promise.all([obras(), contratos(), vincs()]);
      const v = vs.find(x => (x.orcamento_ids || []).includes(orcId));
      const c = v && cs.find(x => x.id === v.contrato_id);
      el.innerHTML = `<div class="ctosm-card" style="margin:0 0 14px"><h3>Obra e contrato</h3>
        <div class="mut">Liga este orçamento à obra (Projetos e relatório de obras) e ao contrato (Controle de Empenhos).</div>
        <div class="ctosm-row"><select id="ctosm-obra"><option value="">— obra (Relatório de Obras) —</option>${obs.map(o => `<option value="${o.id}" ${v && v.obra_id === o.id ? 'selected' : ''}>${e(o.nome)}${o.status ? ' · ' + e(o.status) : ''}</option>`).join('')}</select>
          ${v ? `<a class="ctosm-btn sec" href="${LINKS.rel}?obra=${v.obra_id}" target="_blank" rel="noopener">abrir obra ↗</a>` : ''}</div>
        <div class="ctosm-row"><select id="ctosm-ctr"><option value="">— contrato (Controle de Empenhos) —</option>${cs.map(x => `<option value="${x.id}" ${c && c.id === x.id ? 'selected' : ''}>${e(x.numero_contrato)} — ${e(x.credor)}</option>`).join('')}</select>
          ${c ? `<a class="ctosm-btn sec" href="${LINKS.emp}?contrato=${c.id}" target="_blank" rel="noopener">abrir empenhos ↗</a>` : ''}</div>
        ${c ? kpisContrato(c) : ''}
        ${v ? `<details open><summary style="cursor:pointer;margin:6px 0">Projetos da obra (PDF e DWG)</summary><div id="ctosm-projs" class="mut">Carregando projetos…</div></details>` : ''}
        <div class="ctosm-row"><button class="ctosm-btn" id="ctosm-salvar">Salvar vínculos</button><span class="mut" id="ctosm-msg">O contrato fica gravado na obra: vale para todos os orçamentos dela.</span></div></div>`;
      if (v) projetosObra(v.obra_id).then(ps => { const d = el.querySelector('#ctosm-projs'); if (d) d.outerHTML = listaProjetos(ps, orcId); }).catch(err => { const d = el.querySelector('#ctosm-projs'); if (d) d.textContent = 'Não foi possível carregar os projetos: ' + (err.message || err); });
      el.querySelector('#ctosm-salvar').onclick = async () => {
        const oid = el.querySelector('#ctosm-obra').value, cid = el.querySelector('#ctosm-ctr').value || null;
        try {
          if (!oid){ if (v){ v.orcamento_ids = v.orcamento_ids.filter(x => x !== orcId); await salvar(v); } painelOrc(el, orcId); return; }
          await soltarOrc(orcId, oid);
          const atual = (await vincs()).find(x => x.obra_id === oid);
          const ob = obs.find(o => o.id === oid);
          await salvar({ obra_id:oid, obra_nome:ob ? ob.nome : '', contrato_id:cid, orcamento_ids:[...new Set([...(atual ? atual.orcamento_ids : []), orcId])] });
          painelOrc(el, orcId);
        } catch(err){ el.querySelector('#ctosm-msg').textContent = 'Erro: ' + (err.message || err); } };
    } catch(err){ erro(el, err); }
  }

  // ---------- painel no CONTRATO (Empenhos): obras e orçamentos ligados ----------
  async function painelContrato(el, contratoId){
    injectCss(); if (!el || !contratoId) return; el.innerHTML = '<div class="ctosm-card"><div class="mut">Carregando obras vinculadas…</div></div>';
    try {
      const [vs, os] = await Promise.all([vincs(), orcs()]);
      const meus = vs.filter(v => v.contrato_id === contratoId);
      const om = new Map(os.map(o => [o.id, o]));
      const tot = meus.reduce((s, v) => s + (v.orcamento_ids || []).reduce((t, id) => t + (+(om.get(id) || {}).valor_final || 0), 0), 0);
      el.innerHTML = `<div class="ctosm-card"><h3>Obras atendidas por este contrato</h3>
        <div class="mut">Vínculos feitos no Relatório de Obras ou no ObraCerta.${meus.length ? ' Valor orçado das obras: <b>' + money(tot) + '</b>' : ''}</div>
        ${meus.length ? `<ul class="ctosm-list">${meus.map(v => `<li><span><b>${e(v.obra_nome)}</b>${(v.orcamento_ids || []).map(id => om.get(id)).filter(Boolean).map(o => `<br><span class="mut">${e(o.nome)} · ${money(o.valor_final)} · medido ${money(o.medido_final)}</span> <a href="${LINKS.orc}?orc=${o.id}" target="_blank" rel="noopener">orçamento ↗</a>`).join('')}</span>
          <a href="${LINKS.rel}?obra=${v.obra_id}" target="_blank" rel="noopener">obra ↗</a></li>`).join('')}</ul>` : '<div class="mut" style="margin-top:6px">Nenhuma obra vinculada ainda.</div>'}</div>`;
    } catch(err){ erro(el, err); }
  }

  const param = k => new URLSearchParams(location.search).get(k);
  window.CTOSM = { LINKS, bar, painelObra, painelOrc, painelContrato, param, orcsDaObra, projetosObra };
})();

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<style>
:root{
  --g9:#0f3d2a;--g8:#14532d;--g7:#166534;--g6:#15803d;--g5:#16a34a;--g1:#dcfce7;--g0:#f0fdf4;
  --ink:#1c2420;--mut:#5d6b63;--line:#dfe6e1;--bg:#f5f7f5;--card:#fff;--warn:#b45309;--red:#b91c1c;--blue:#1d4ed8;
  --etapa1:#e7f2ea;--etapa2:#f1f7f2;--etapa3:#f8fbf8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--g9);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--g5);display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:0}
nav.main{display:flex;gap:2px;margin-left:12px}
nav.main button{background:none;border:0;color:#cfe8d8;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500}
nav.main button.on,nav.main button:hover{background:rgba(255,255,255,.12);color:#fff}
.conn{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:#facc15}
.dot.ok{background:#4ade80}.dot.off{background:#f87171}
main{padding:18px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 8px}
.mut{color:var(--mut)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b8c7bd;background:#fafcfa}
.btn.pri{background:var(--g7);border-color:var(--g7);color:#fff}.btn.pri:hover{background:var(--g8)}
.btn.dan{color:var(--red)}.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
input.f,select.f,textarea.f{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid #86efac;border-color:var(--g5)}
label.l{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px;font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px}
.subnav button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--g7);border-color:var(--g7)}
table.t{border-collapse:collapse;width:100%}
table.t th{background:#eef3ef;text-align:left;font-size:11.5px;color:#3c4a42;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
table.t td{padding:5px 8px;border-bottom:1px solid #edf1ee;vertical-align:top}
table.t tr:hover td{background:#fbfdfb}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:#e2e8f0;color:#334155}
.tag.SINAPI{background:#dbeafe;color:#1e3a8a}.tag.ORSE{background:#fde68a;color:#78350f}.tag.PROPRIA{background:var(--g1);color:var(--g8)}.tag.MANUAL{background:#fce7f3;color:#9d174d}
.tag.I{background:#f1f5f9;color:#475569}.tag.C{background:#ede9fe;color:#5b21b6}
.plan-wrap{overflow:auto;max-height:calc(100vh - 290px);border:1px solid var(--line);border-radius:8px;background:#fff}
#plan td{border-bottom:1px solid #eef2ef}
#plan tr.et1 td{background:var(--etapa1);font-weight:700}
#plan tr.et2 td{background:var(--etapa2);font-weight:600}
#plan tr.et3 td{background:var(--etapa3);font-weight:600}
#plan tr.sel td{background:#fef9c3!important}
#plan tr{cursor:default}
#plan input.q{width:92px;text-align:right;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:4px;font-variant-numeric:tabular-nums}
#plan input.q:hover{border-color:var(--line)}#plan input.q:focus{border-color:var(--g5);background:#fff;outline:none}
#plan .desc{max-width:560px}
.warnico{color:var(--warn);font-weight:700;cursor:help}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--mut)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:min(760px,96vw);height:100%;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s}
.drawer.open{transform:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .bd{flex:1;overflow:auto}
.res{padding:8px 16px;border-bottom:1px solid #f0f3f1;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;cursor:pointer}
.res:hover{background:var(--g0)}
.res .d{font-size:12.5px}
.res .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(15,30,20,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(820px,100%);padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(1150px,100%)}
.modal .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 16px;border-radius:8px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.empty{padding:40px;text-align:center;color:var(--mut)}
.bar{height:8px;background:#e5ece7;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g5)}
.abcA{background:#fee2e2!important}.abcB{background:#fef3c7!important}.abcC{background:#ecfdf5!important}
.crono input{width:58px;text-align:right;border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.crono td,.crono th{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--g1);color:var(--g8);font-size:11.5px;font-weight:600}
.note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;padding:8px 12px;border-radius:8px;font-size:12.5px}
.lst-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lst-item:last-child{border-bottom:0}
.lst-item:hover{background:#fafcfa}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
/* ===================== LAYOUT PROFISSIONAL (v2) ===================== */
:root{
  --side:220px;--sb:30px;
  --g9:#0e3324;--g8:#14532d;--g7:#166534;--g6:#15803d;--g5:#16a34a;--g1:#dcfce7;--g0:#f0fdf4;
  --ink:#16201b;--mut:#5f6d66;--line:#dde4df;--line2:#edf1ee;--bg:#f3f5f4;--card:#fff;--hd:#eef2ef;--hover:#f7faf8;
  --sel:#fff5c2;--selline:#eab308;--focus:#22c55e;
  --etapa1:#e4efe7;--etapa2:#eef5f0;--etapa3:#f6faf7;
  --side-bg:#0e2a1d;--side-ink:#b9d3c4;--side-on:#ffffff;--side-hi:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(16,24,20,.05),0 1px 1px rgba(16,24,20,.03);
}
html[data-theme=dark]{
  --ink:#e3ebe6;--mut:#93a49b;--line:#2a3530;--line2:#232d29;--bg:#111714;--card:#171f1b;--hd:#1d2722;--hover:#1b2520;
  --sel:#3a3413;--selline:#ca8a04;--g0:#132119;--g1:#183a27;
  --etapa1:#1c2e24;--etapa2:#19281f;--etapa3:#17221c;
  --side-bg:#0b1310;--side-ink:#97ae9f;--side-hi:rgba(255,255,255,.06);
  --shadow:none;color-scheme:dark;
}
body{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:100vh;background:var(--bg);font-size:13px;letter-spacing:-.003em}
body > .ctosm-bar{grid-column:1/-1}
/* sidebar */
header.top{grid-column:1;grid-row:2;position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;gap:0;padding:14px 10px calc(var(--sb) + 10px);background:var(--side-bg);border-right:1px solid rgba(255,255,255,.04)}
.brand{padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#22c55e,#15803d);font-size:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.brand small{font-size:10.5px;opacity:.6;margin-top:2px}
nav.main{flex-direction:column;margin:0;gap:2px}
.side-lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-ink);opacity:.55;padding:10px 10px 6px;font-weight:600}
nav.main button,.side-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px}
nav.main button svg,.side-btn svg{width:16px;height:16px;flex:none;opacity:.85}
nav.main button:hover,.side-btn:hover{background:var(--side-hi);color:#fff}
nav.main button.on{background:rgba(34,197,94,.14);color:var(--side-on);box-shadow:inset 2px 0 0 #22c55e}
nav.main button kbd,.side-btn kbd{margin-left:auto}
.side-sp{flex:1}
.conn{margin:8px 0 0;padding:8px 10px;border-top:1px solid rgba(255,255,255,.07);color:var(--side-ink);font-size:11.5px}
kbd{font:500 10.5px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line);border-bottom-width:2px;background:var(--card);color:var(--mut);white-space:nowrap}
header.top kbd{background:transparent;border-color:rgba(255,255,255,.18);color:var(--side-ink)}
main{grid-column:2;grid-row:2;padding:20px 24px calc(var(--sb) + 20px);max-width:none;width:100%;margin:0;min-width:0}
/* superfícies */
.card,.kpi,.plan-wrap,.modal,.drawer,.btn,input.f,select.f,textarea.f{background:var(--card);border-color:var(--line)}
.card{border-radius:8px;box-shadow:var(--shadow)}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em}h2{font-size:15px;font-weight:650}
.btn{border-radius:6px;padding:6px 11px;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{background:var(--hover);border-color:#b8c7bd}
.btn.pri{background:var(--g7);border-color:var(--g7);color:#fff}.btn.pri:hover{background:var(--g8)}
.btn kbd{margin-left:4px;padding:1px 4px;font-size:9.5px}
.btn.pri kbd{background:transparent;color:#d1fae5;border-color:rgba(255,255,255,.35)}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid color-mix(in srgb,var(--focus) 45%,transparent);border-color:var(--g5)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.subnav{border-color:var(--line)}
.subnav button{padding:8px 14px;font-size:12.5px}
.subnav button .k{font:500 9.5px var(--mono);opacity:.55;margin-left:6px}
.kpis{gap:10px}
.kpi{border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);border-left:3px solid var(--line)}
.kpi:last-child{border-left-color:var(--g5)}
.kpi b{font:600 16px var(--mono);letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
/* tabela da planilha */
table.t th{background:var(--hd);color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-color:var(--line);padding:7px 8px}
table.t td{border-color:var(--line2)}
table.t tr:hover td{background:var(--hover)}
td.n{font-family:var(--mono);font-size:12px;letter-spacing:-.02em}
.plan-wrap{border-radius:8px;max-height:calc(100vh - 300px);box-shadow:var(--shadow)}
#plan td{padding:4px 8px;border-color:var(--line2)}
#plan td:first-child{font:500 11.5px var(--mono);color:var(--mut);white-space:nowrap}
#plan tr.et1 td{background:var(--etapa1);font-weight:700;border-top:1px solid var(--line)}
#plan tr.et1 td:first-child{color:var(--g7)}
#plan tr.et2 td{background:var(--etapa2)}#plan tr.et2 td:nth-child(2){padding-left:22px}
#plan tr.et3 td{background:var(--etapa3)}#plan tr.et3 td:nth-child(2){padding-left:36px}
#plan tr.sel td{background:var(--sel)!important}
#plan tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--selline)}
#plan tr.cur td{box-shadow:inset 0 1px 0 var(--selline),inset 0 -1px 0 var(--selline)}
#plan tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--selline),inset 0 1px 0 var(--selline),inset 0 -1px 0 var(--selline)}
#plan input.q{font:12px var(--mono);color:var(--ink)}
#plan input.q:focus{background:var(--card);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 40%,transparent)}
#plan .desc{font-size:12.5px}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:var(--shadow)}
.toolbar .btn{box-shadow:none}
.sep{background:var(--line)}
/* barra de status */
#statusbar{position:fixed;left:var(--side);right:0;bottom:0;height:var(--sb);display:flex;align-items:center;gap:0;background:var(--card);border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);z-index:40;overflow:hidden;white-space:nowrap}
#statusbar > span{padding:0 12px;border-right:1px solid var(--line2);height:100%;display:flex;align-items:center;gap:6px}
#statusbar b{color:var(--ink);font:500 11.5px var(--mono)}
#statusbar .grow{flex:1;border:0}
#statusbar .ok{color:var(--g6)}#statusbar .bad{color:var(--warn)}
/* paleta de comandos */
#pal-bg{position:fixed;inset:0;background:rgba(10,20,15,.42);backdrop-filter:blur(2px);z-index:95;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal-bg.open{display:flex}
#pal{width:min(640px,94vw);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:15px 18px;font-size:15px;background:transparent;outline:none;color:var(--ink)}
#pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-g{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:8px 10px 4px;font-weight:600}
.pal-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.pal-i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i .s{color:var(--mut);font-size:11.5px}
.pal-i.on{background:var(--g0);box-shadow:inset 2px 0 0 var(--g5)}
.pal-ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);background:var(--hd)}
/* drawer de busca */
.res.on{background:var(--g0);box-shadow:inset 3px 0 0 var(--g5)}
.res:hover{background:var(--hover)}
.drawer .hd{background:var(--card)}
/* atalhos */
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 28px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2)}
.keys h3{grid-column:1/-1;margin:12px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
/* escuro: cores fixas antigas */
html[data-theme=dark] .lst-item:hover{background:var(--hover)}
html[data-theme=dark] .subnav button.on{color:#4ade80;border-color:#4ade80}
html[data-theme=dark] .kpi b[style*="--g7"],html[data-theme=dark] #plan tr.et1 td:first-child{color:#4ade80!important}
html[data-theme=dark] .btn.dan{color:#f87171}
html[data-theme=dark] .pill{background:#183a27;color:#86efac}
html[data-theme=dark] .note{background:#2a2410;border-color:#4d3f12;color:#f5d98a}
html[data-theme=dark] .tag{filter:saturate(.9) brightness(.92)}
html[data-theme=dark] .modal-bg{background:rgba(0,0,0,.6)}
html[data-theme=dark] #toast{background:#e3ebe6;color:#111}
html[data-theme=dark] table.t td[style*="background"],html[data-theme=dark] tr[style*="background"]{background:var(--hd)!important}
html[data-theme=dark] .abcA{background:#3a1d1d!important}html[data-theme=dark] .abcB{background:#3a3115!important}html[data-theme=dark] .abcC{background:#16301f!important}
html[data-theme=dark] .bar{background:#26322c}
html[data-theme=dark] .crono input{background:var(--card);border-color:var(--line)}
/* telas menores: barra lateral vira barra superior */
@media (max-width:900px){
  body{grid-template-columns:1fr}
  header.top{grid-column:1;grid-row:2;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px;gap:6px}
  .brand{border:0;margin:0;padding:0 6px 0 0}.brand small{display:none}
  nav.main{flex-direction:row;flex-wrap:wrap}.side-lbl,.side-sp,header.top .side-extra{display:none}
  nav.main button kbd{display:none}
  .conn{border:0;margin:0 0 0 auto;padding:0}
  main{grid-column:1;grid-row:3;padding:14px 12px calc(var(--sb) + 14px)}
  #statusbar{left:0}#statusbar .hide-sm{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media print{ body{display:block} #statusbar,#pal-bg{display:none!important} }

function memLines(txt){ const out = [];
  for (let raw of String(txt || '').split(/\n/)){ const l = raw.trim(); if (!l) continue;
    let lab = '', ex = l; const m = l.match(/^(.*?)\s*[:=]\s*([-+]?[\d.,\s()xX*+\/-]+)$/); if (m && /\d/.test(m[2])){ lab = m[1].trim(); ex = m[2].trim(); }
    else if (!/^[-+]?[\d.,\s()xX*+\/-]+$/.test(l) || !/\d/.test(l)){ out.push({ lab:l, nota:true }); continue; }
    let neg = false; if (/^-/.test(ex) && lab){ neg = true; } if (/^-\s*$/.test(lab)){ neg = true; lab = ''; } if (/^-/.test(lab)){ neg = true; lab = lab.replace(/^-\s*/, ''); }
    const pure = /^[-+]?\s*\d[\d.,]*(\s*[xX*]\s*\d[\d.,]*)*$/.test(ex);
    const fac = pure ? ex.replace(/^[-+]\s*/, '').split(/\s*[xX*]\s*/).map(f => evalExpr(f)) : null;
    let v = evalExpr(ex.replace(/^[-+]\s*/, '')); if (isNaN(v)) { out.push({ lab:l, nota:true }); continue; }
    if (neg) v = -Math.abs(v);
    out.push({ lab, ex, fac:fac && fac.length <= 4 ? fac : null, v, neg }); }
  return out; }
function memSum(txt){ const L = memLines(txt).filter(x => !x.nota); return L.length ? Math.round(L.reduce((a, x) => a + x.v, 0) * 10000) / 10000 : null; }
function evalExpr(s){ // quantidade com expressão: 2*3,5+4
  s = String(s ?? '').trim(); if (!s) return 0;
  const t = s.replace(/(\d),(\d)/g, '$1.$2').replace(/\s/g, '').replace(/x/gi, '*');
  if (!/^[\d.+\-*/()]+$/.test(t)) return NaN;
  try { const v = Function('"use strict";return (' + t + ')')(); return isFinite(v) ? v : NaN; } catch { return NaN; }
}
function toast(msg, ms=2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
function debounce(fn, ms){ let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; }

/* ---------- IndexedDB kv ---------- */
const IDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { let rq; try { rq = indexedDB.open('obracerta', 1); } catch(e){ return rej(e); }
      rq.onupgradeneeded = () => { const d = rq.result; ['kv'].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); }; rq.onerror = () => rej(rq.error); }); },
  async get(k){ try { const d = await this.open(); return await new Promise(r => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); }); } catch { return undefined; } },
  async set(k, v){ try { const d = await this.open(); return await new Promise(r => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => r(true); tx.onerror = () => r(false); }); } catch { return false; } },
  async del(k){ try { const d = await this.open(); return await new Promise(r => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => r(true); }); } catch { return false; } },
};

/* =================== STORAGE (Supabase ou local) =================== */
const Store = {
  sb: null, online: false,
  async init(){
    try {
      if (!window.supabase) throw new Error('lib');
      this.sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      const { error } = await Promise.race([
        this.sb.from('orc_bases').select('id').limit(1),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
      if (error) throw error;
      this.online = true;
    } catch(e) { console.warn('Modo local:', e); this.online = false; }
    const d = $('#conn-dot'), t = $('#conn-txt');
    d.className = 'dot ' + (this.online ? 'ok' : 'off');
    t.textContent = this.online ? 'Online · banco compartilhado' : 'Modo local (sem conexão com o banco)';
  },
  async _lget(k, def){ const v = await IDB.get(k); return v === undefined ? def : v; },
  // ---- orçamentos
  async listOrcs(){
    if (this.online){ const { data, error } = await this.sb.from('orc_orcamentos').select('id,nome,atualizado_em,resumo:dados->resumo').order('atualizado_em', { ascending:false }); if (error) throw error; return data; }
    const all = await this._lget('orcs', {}); return Object.values(all).map(o => ({ id:o.id, nome:o.nome, atualizado_em:o.atualizado_em, resumo:o.dados.resumo })).sort((a, b) => b.atualizado_em.localeCompare(a.atualizado_em));
  },
  async getOrc(id){
    if (this.online){ const { data, error } = await this.sb.from('orc_orcamentos').select('*').eq('id', id).single(); if (error) throw error; return data; }
    return (await this._lget('orcs', {}))[id];
  },
  async stampOrc(id){
    if (!this.online) return (await this._lget('orcs', {}))[id]?.atualizado_em;
    const { data } = await this.sb.from('orc_orcamentos').select('atualizado_em').eq('id', id).maybeSingle(); return data?.atualizado_em;
  },
  async saveOrc(row){
    row.atualizado_em = new Date().toISOString();
    if (this.online){ const { data, error } = await this.sb.from('orc_orcamentos').upsert(row).select('atualizado_em').single(); if (error) throw error; return data.atualizado_em; }
    const all = await this._lget('orcs', {}); all[row.id] = JSON.parse(JSON.stringify(row)); await IDB.set('orcs', all); return row.atualizado_em;
  },
  async delOrc(id){
    if (this.online){ const { error } = await this.sb.from('orc_orcamentos').delete().eq('id', id); if (error) throw error; return; }
    const all = await this._lget('orcs', {}); delete all[id]; await IDB.set('orcs', all);
  },
  // ---- perfis de contrato (empresa: BDI, desconto, regime) – cada contrato tem os seus
  async listCtr(){
    if (this.online){ try { const { data, error } = await this.sb.from('orc_contratos').select('*').order('nome'); if (error) throw error; return data.map(r => ({ ...r.dados, id:r.id, nome:r.nome })); } catch(e){ console.warn(e); } }
    return Object.values(await this._lget('ctrs', {})).sort((a, b) => a.nome.localeCompare(b.nome));
  },
  async saveCtr(p){
    if (this.online){ const { error } = await this.sb.from('orc_contratos').upsert({ id:p.id, nome:p.nome, dados:p, atualizado_em:new Date().toISOString() }); if (error) throw error; return; }
    const all = await this._lget('ctrs', {}); all[p.id] = p; await IDB.set('ctrs', all);
  },
  async delCtr(id){
    if (this.online){ const { error } = await this.sb.from('orc_contratos').delete().eq('id', id); if (error) throw error; return; }
    const all = await this._lget('ctrs', {}); delete all[id]; await IDB.set('ctrs', all);
  },
  // ---- composições próprias
  async listProp(){
    if (this.online){ const { data, error } = await this.sb.from('orc_proprias').select('*').order('codigo'); if (error) throw error; return data.map(r => ({ ...r.dados, id:r.id, codigo:r.codigo })); }
    return Object.values(await this._lget('props', {})).sort((a, b) => a.codigo.localeCompare(b.codigo));
  },
  async saveProp(p){
    if (this.online){ const { error } = await this.sb.from('orc_proprias').upsert({ id:p.id, codigo:p.codigo, dados:p, atualizado_em:new Date().toISOString() }); if (error) throw error; return; }
    const all = await this._lget('props', {}); all[p.id] = p; await IDB.set('props', all);
  },
  async delProp(id){
    if (this.online){ const { error } = await this.sb.from('orc_proprias').delete().eq('id', id); if (error) throw error; return; }
    const all = await this._lget('props', {}); delete all[id]; await IDB.set('props', all);
  },
  // ---- bases importadas
  async listBases(){
    if (this.online){ const { data, error } = await this.sb.from('orc_bases').select('*').order('fonte'); if (error) throw error; return data; }
    return Object.values(await this._lget('bases', {}));
  },
  async loadBaseItems(id, onProg){
    const cacheKey = 'base:' + id;
    if (this.online){
      const meta = (await this.sb.from('orc_bases').select('meta').eq('id', id).single()).data?.meta || {};
      const cached = await IDB.get(cacheKey);
      if (cached && cached.stamp === meta.stamp) return cached;
      const pull = async (table, cols) => { const out = []; let from = 0; const N = 1000;
        for (;;){ const { data, error } = await this.sb.from(table).select(cols).eq('base_id', id).range(from, from + N - 1); if (error) throw error;
          out.push(...data); onProg && onProg(out.length); if (data.length < N) break; from += N; } return out; };
      const itens = await pull('orc_base_itens', 'tipo,codigo,descricao,unidade,grupo,preco_nd,preco_d,extra');
      const anal = await pull('orc_base_analitico', 'comp_codigo,item_tipo,item_codigo,coef');
      const res = { stamp:meta.stamp, itens, anal }; IDB.set(cacheKey, res); return res;
    }
    return (await IDB.get(cacheKey)) || { itens:[], anal:[] };
  },
  async saveBase(meta, itens, anal, onProg){
    meta.meta = { ...(meta.meta || {}), stamp: Date.now() };
    if (this.online){
      let { error } = await this.sb.from('orc_bases').upsert(meta); if (error) throw error;
      if (itens){
        await this.sb.from('orc_base_itens').delete().eq('base_id', meta.id);
        for (let i = 0; i < itens.length; i += 500){ const ch = itens.slice(i, i + 500).map(x => ({ ...x, base_id:meta.id }));
          ({ error } = await this.sb.from('orc_base_itens').upsert(ch)); if (error) throw error; onProg && onProg(i + ch.length, itens.length); }
      }
      if (anal){
        await this.sb.from('orc_base_analitico').delete().eq('base_id', meta.id);
        for (let i = 0; i < anal.length; i += 1000){ const ch = anal.slice(i, i + 1000).map(x => ({ ...x, base_id:meta.id }));
          ({ error } = await this.sb.from('orc_base_analitico').upsert(ch)); if (error) throw error; onProg && onProg(i + ch.length, anal.length); }
      }
      await IDB.del('base:' + meta.id);
      return;
    }
    const all = await this._lget('bases', {}); all[meta.id] = meta; await IDB.set('bases', all);
    const cur = (await IDB.get('base:' + meta.id)) || { itens:[], anal:[] };
    await IDB.set('base:' + meta.id, { stamp:meta.meta.stamp, itens: itens || cur.itens, anal: anal || cur.anal });
  },
  async baseCount(id){
    if (!this.online) return null;
    const a = await this.sb.from('orc_base_itens').select('codigo', { count:'exact', head:true }).eq('base_id', id);
    const b = await this.sb.from('orc_base_analitico').select('comp_codigo', { count:'exact', head:true }).eq('base_id', id);
    return { itens:a.count || 0, anal:b.count || 0 };
  },
  async delBase(id){
    if (this.online){ const { error } = await this.sb.from('orc_bases').delete().eq('id', id); if (error) throw error; }
    else { const all = await this._lget('bases', {}); delete all[id]; await IDB.set('bases', all); }
    await IDB.del('base:' + id);
  },
};

/* =================== BASES DE PREÇO =================== */
const Bases = {
  list: [],         // metas {id,fonte,uf,ref,desc,embedded,loaded}
  data: {},         // id -> base carregada
  props: [],        // composições próprias
  propMap: new Map(),
  async init(){
    // base embutida SINAPI-MT 09/2026
    const emb = await this.decodeEmbedded();
    this.data[emb.id] = emb;
    this.list = [{ id:emb.id, fonte:emb.fonte, uf:emb.uf, ref:emb.ref, desc:emb.desc, embedded:true, nI:emb.I.size, nC:emb.C.size, hasA:emb.A.size > 0 }];
    try {
      const remote = await Store.listBases();
      for (const b of remote){
        if (b.id === emb.id){ // cópia da base embutida no banco: só busca se a embutida não tiver analítico
          if (!emb.A.size) this.list[0].remote = true; continue; }
        this.list.push({ id:b.id, fonte:b.fonte, uf:b.uf, ref:b.referencia, desc:b.descricao, nI:b.meta?.nI, nC:b.meta?.nC, hasA:!!b.meta?.nA });
      }
    } catch(e){ console.warn(e); }
    await this.reloadProps();
  },
  async reloadProps(){
    try { this.props = await Store.listProp(); } catch(e){ console.warn(e); this.props = []; }
    this.propMap = new Map(this.props.map(p => [ckey(p.codigo), p]));
  },
  async decodeEmbedded(){
    const b64 = $('#emb-sinapi').textContent.trim();
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const j = JSON.parse(txt);
    const b = { id:j.id, fonte:j.fonte, uf:j.uf, ref:j.ref, desc:j.desc, encargos:j.encargos, I:new Map(), C:new Map(), A:new Map() };
    for (const [c, d, u, nd, dd, o] of j.I) b.I.set(ckey(c), { t:'I', c, d, u, nd, dd, o });
    for (const [c, d, u, g, nd, dd, asn, asd] of j.C) b.C.set(ckey(c), { t:'C', c, d, u, g:j.grupos[g], nd, dd, asn, asd });
    for (const [k, its] of Object.entries(j.A || {})) b.A.set(ckey(k), its.map(([t, c, coef]) => ({ t, k:ckey(c), coef })));
    return b;
  },
  meta(id){ return this.list.find(b => b.id === id); },
  async ensure(id, onProg){
    if (!id) return null;
    const m = this.meta(id);
    if (this.data[id] && !(m && m.remote && !this.data[id]._remoteLoaded)) return this.data[id];
    const raw = await Store.loadBaseItems(id, onProg);
    let b = this.data[id];
    if (!b){ b = { id, fonte:m?.fonte, uf:m?.uf, ref:m?.ref, desc:m?.desc, I:new Map(), C:new Map(), A:new Map() };
      for (const x of raw.itens) (x.tipo === 'I' ? b.I : b.C).set(ckey(x.codigo), { t:x.tipo, c:x.codigo, d:x.descricao, u:x.unidade, g:x.grupo, nd:x.preco_nd == null ? null : +x.preco_nd, dd:x.preco_d == null ? null : +x.preco_d, ...(x.extra || {}) });
      this.data[id] = b; }
    if (raw.anal.length && m?.embedded) b.A = new Map();
    for (const a of raw.anal){ const k = ckey(a.comp_codigo); if (!b.A.has(k)) b.A.set(k, []); b.A.get(k).push({ t:a.item_tipo, k:ckey(a.item_codigo), coef:+a.coef }); }
    if (m){ m.hasA = b.A.size > 0; }
    b._remoteLoaded = true; b._search = null;
    return b;
  },
  searchList(b){
    if (!b._search){ b._search = [];
      for (const m of [b.I, b.C]) for (const r of m.values()) b._search.push({ r, n: norm(r.d) + ' ' + r.c + ' ' + ckey(r.c) }); }
    return b._search;
  },
  find(b, code){ const k = ckey(code); return b.C.get(k) || b.I.get(k) || null; },
  price(r, des){ if (!r) return null; const v = des ? r.dd : r.nd; return v == null ? null : +v; },
  // custo de composição própria (recursivo)
  propCost(p, ctx, depth=0){
    if (!p || depth > 8) return { total:null, faltando:['recursão'] };
    let total = 0; const faltando = [];
    for (const it of p.itens || []){
      const v = this.unitCost(it.fonte, it.codigo, ctx, depth + 1, it.preco);
      const pr = v.price ?? (it.preco != null && !isNaN(+it.preco) ? +it.preco : null);
      if (pr == null){ faltando.push(it.codigo); continue; }
      total += pr * (+it.coef || 0);
    }
    return { total:r2(total), faltando };
  },
  // preço unitário de qualquer referência (sem BDI)
  unitCost(fonte, codigo, ctx, depth=0, manual=null){
    fonte = fonteKey(fonte);
    if (fonte === 'PRÓPRIA'){ const p = this.propMap.get(ckey(codigo)); if (!p) return { price:null, rec:null };
      const c = this.propCost(p, ctx, depth); return { price:c.total, rec:{ t:'C', c:p.codigo, d:p.descricao, u:p.unidade, prop:p }, faltando:c.faltando }; }
    if (fonte === 'MANUAL' || fonte === 'COTAÇÃO') return { price: manual, rec:null };
    const bid = ctx.bases?.[fonte]; const b = bid && this.data[bid];
    if (!b) return { price:null, rec:null };
    const r = this.find(b, codigo);
    return { price:this.price(r, ctx.des), rec:r, base:b };
  },
  fontes(){ const s = new Set(this.list.map(b => b.fonte)); return [...s]; },
  basesByFonte(f){ return this.list.filter(b => b.fonte === f).sort((a, b) => (b.ref || '').localeCompare(a.ref || '')); },
};

const BDI_DEF = { ac:4.00, sg:0.80, r:1.27, g:0, df:1.23, l:7.40, pis:0.65, cofins:3.00, iss:2.00, cprb:4.50, dif:{ on:false, ac:3.45, sg:0.48, r:0.85, g:0.85, df:0.85, l:5.11 } };
function bdiCalc(b, dif=false, des=false){
  if (!dif && b.fixoOn && b.fixo != null) return Math.round(+b.fixo * 100) / 10000;
  const s = dif ? { ...b, ...b.dif } : b;
  const I = (+b.pis + +b.cofins + +b.iss + (des ? +b.cprb : 0)) / 100;
  const v = ((1 + (+s.ac + +s.sg + +s.r + +s.g) / 100) * (1 + +s.df / 100) * (1 + +s.l / 100)) / (1 - I) - 1;
  return Math.round(v * 10000) / 10000;
}

        if (custo == null){ custo = it.custo ?? 0; if (!warn) warn = 'Sem preço na base para esta referência'; }

  /* ---------- Drawer de pesquisa ---------- */
  drawerCb:null, drawerFontes:[], drawerTipo:'',
  openDrawer({ title='Inserir item', fontes, ctx, onPick, keepOpen=true }){
    this.drawerCb = onPick; this.drawerCtx = ctx; this.drawerKeep = keepOpen;
    $('#dr-title').textContent = title;
    const fl = fontes.map(f => `<label class="chk"><input type="checkbox" data-f="${esc(f)}" checked> <span class="tag ${tagCls(f)}">${esc(f)}</span></label>`).join('');
    $('#dr-filters').innerHTML = fl + `<span class="sep"></span><select class="f" id="dr-tipo" style="width:auto;padding:3px 6px"><option value="">Insumos e composições</option><option value="C">Só composições</option><option value="I">Só insumos</option></select>
      <span class="sep"></span><button class="btn sm" id="dr-man">+ Item manual / cotação</button>`;
    $('#drawer').classList.add('open'); const q = $('#dr-q'); q.value = ''; q.focus();
    const run = debounce(() => this.search(), 140); q.oninput = run; $$('#dr-filters input, #dr-tipo').forEach(x => x.onchange = run);
    $('#dr-man').onclick = () => this.manualItem();
    $('#dr-res').innerHTML = `<div class="empty">Digite parte da descrição ou o código. Use várias palavras para refinar (ex.: <i>porcelanato 60 assentamento</i>).</div>`;
  },
  closeDrawer(){ $('#drawer').classList.remove('open'); },
  search(){
    const q = norm($('#dr-q').value).trim(); const out = $('#dr-res');
    if (q.length < 2){ out.innerHTML = ''; return; }
    const toks = q.split(/\s+/).filter(Boolean);
    const fontes = $$('#dr-filters input[data-f]').filter(x => x.checked).map(x => x.dataset.f);
    const tipo = $('#dr-tipo').value; const ctx = this.drawerCtx; const res = [];
    for (const f of fontes){
      if (f === 'PRÓPRIA'){ for (const p of Bases.props){ const n = norm(p.descricao) + ' ' + norm(p.codigo); if (tipo === 'I') continue; if (toks.every(t => n.includes(t))) res.push({ f, r:{ t:'C', c:p.codigo, d:p.descricao, u:p.unidade }, score:0 }); } continue; }
      const b = Bases.data[ctx.bases?.[f]]; if (!b) continue;
      for (const s of Bases.searchList(b)){ if (tipo && s.r.t !== tipo) continue;
        if (toks.every(t => s.n.includes(t))){ const sc = (s.r.c === q || ckey(s.r.c) === ckey(q)) ? -2 : (s.n.startsWith(toks[0]) ? -1 : 0); res.push({ f, r:s.r, score:sc }); if (res.length > 1500) break; } }
    }
    res.sort((a, b) => a.score - b.score || a.r.d.localeCompare(b.r.d));
    const show = res.slice(0, 250);
    out.innerHTML = `<div class="small mut" style="padding:6px 16px">${res.length > 250 ? 'Mostrando 250 de ' + res.length + ' resultados — refine a busca' : res.length + ' resultado(s)'}. Clique para inserir.</div>` +
      show.map((x, i) => { const u = Bases.unitCost(x.f, x.r.c, ctx); return `<div class="res" data-i="${i}"><div><span class="tag ${tagCls(x.f)}">${esc(x.f)}</span><br><span class="tag ${x.r.t}">${x.r.t === 'C' ? 'COMP' : 'INSUMO'}</span></div>
        <div class="d"><span class="code">${esc(x.r.c)}</span> — ${esc(x.r.d)}${x.r.asn ? ` <span class="warnico" title="%AS: parte do custo com preço de São Paulo">AS ${x.r.asn}%</span>` : ''}${x.r.g ? `<div class="small mut">${esc(x.r.g)}</div>` : ''}</div>
        <div class="p"><b>${u.price == null ? '<span class="mut">sem preço</span>' : 'R$ ' + fm(u.price)}</b><div class="small mut">${esc(x.r.u || '')}</div></div></div>`; }).join('');
    $$('.res', out).forEach(el => el.onclick = () => { const x = show[+el.dataset.i]; this.drawerCb(x.r, x.f); el.style.background = '#dcfce7'; if (!this.drawerKeep) this.closeDrawer(); else toast('Inserido: ' + x.r.c); });
  },
  manualItem(){
    this.modal(`<h2>Item manual / cotação</h2><div class="grid g4"><div><label class="l">Código</label><input class="f" id="m-c" value="COT-"></div><div><label class="l">Unidade</label><input class="f" id="m-u" value="UN"></div><div><label class="l">Custo unitário sem BDI (R$)</label><input class="f" id="m-p"></div><div><label class="l">Fonte</label><input class="f" id="m-f" value="COTAÇÃO"></div></div>
      <div style="margin-top:10px"><label class="l">Descrição</label><textarea class="f" id="m-d" rows="3"></textarea></div>
      <div class="ft"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn pri" id="m-ok">Inserir</button></div>`);
    $('#m-ok').onclick = () => { const rec = { t:'I', c:$('#m-c').value.trim(), d:$('#m-d').value.trim().toUpperCase(), u:$('#m-u').value.trim().toUpperCase(), preco:parseNum($('#m-p').value) || 0 };
      if (!rec.d) return toast('Informe a descrição'); this.closeModal(); this.drawerCb(rec, 'MANUAL', $('#m-f').value.trim() || 'COTAÇÃO'); };
  },
};

/* ---------- Analítico (abertura de composição) ---------- */
function analRows(b, code, des){ const its = b?.A.get(ckey(code)); if (!its) return null;
  return its.map(i => { const r = i.t === 'I' ? b.I.get(i.k) : b.C.get(i.k); const p = Bases.price(r, des); return { t:i.t, c:r?.c || i.k, d:r?.d || '(não encontrado na base)', u:r?.u || '', coef:i.coef, pu:p, tot:p == null ? null : p * i.coef }; }); }
function analTable(rows){ if (!rows) return ''; const tot = rows.reduce((a, x) => a + (x.tot || 0), 0);
  return `<table class="t" style="margin-top:6px"><thead><tr><th>Tipo</th><th>Código</th><th>Descrição</th><th>Und</th><th class="n">Coef.</th><th class="n">Preço unit.</th><th class="n">Total</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td><span class="tag ${x.t}">${x.t === 'C' ? 'COMP' : 'INSUMO'}</span></td><td class="code">${esc(x.c)}</td><td class="small">${esc(x.d)}</td><td>${esc(x.u)}</td><td class="n">${nf4.format(x.coef)}</td><td class="n">${x.pu == null ? '<span class="warnico">sem preço</span>' : fm(x.pu)}</td><td class="n">${fm(x.tot)}</td></tr>`).join('')}
    <tr><td colspan="6" class="n"><b>Soma dos itens</b></td><td class="n"><b>${fm(tot)}</b></td></tr></tbody></table>`; }
function copiarComoPropria(b, rec){ const rows = analRows(b, rec.c, false); if (!rows) return toast('Composição sem analítico');
  const n = Bases.props.reduce((m, p) => Math.max(m, parseInt(String(p.codigo).replace(/\D/g, '')) || 0), 0) + 1;
  Prop.cur = { id:uid(), codigo:'CP-' + String(n).padStart(4, '0'), descricao:rec.d, unidade:rec.u, grupo:rec.g || '', obs:`COMPOSIÇÃO UTILIZADA ${b.fonte} - ${rec.c}`, novo:true,
    itens:rows.map(x => ({ fonte:b.fonte, tipo:x.t, codigo:x.c, descricao:x.d, unidade:x.u, coef:x.coef })) };
  Prop.ctx = { bases:{ [b.fonte]:b.id }, des:true }; UI.closeModal(); UI.closeDrawer(); UI.go('proprias'); toast('Ajuste os coeficientes e salve a nova composição'); }

/* ---------- Curva ABC ---------- */
const ABC = {
  modo:'serv',
  servicos(){
    const m = new Map();
    for (const it of Orc.doc.itens){ if (it.tipo !== 'item') continue; const k = it.fonte + '|' + ckey(it.codigo);
      const x = m.get(k) || { fonte:it.fonteLabel || it.fonte, codigo:it.codigo, descricao:it.descricao, unidade:it.unidade, qtd:0, pu:it._pu, total:0 };
      x.qtd += +it.qtd || 0; x.total += it._tot; m.set(k, x); }
    return this.classify([...m.values()]);
  },
  insumos(){
    const ctx = Orc.ctx(), m = new Map(); let semAnal = 0;
    const add = (fonte, rec, qty, mult) => { const k = fonte + '|' + ckey(rec.c); const pu = Bases.unitCost(fonte, rec.c, ctx).price ?? 0;
      const x = m.get(k) || { fonte, codigo:rec.c, descricao:rec.d, unidade:rec.u, qtd:0, pu:r2(pu * mult), total:0, tipo:tipoInsumo(rec) }; x.qtd += qty; x.total += qty * pu * mult; m.set(k, x); };
    const explode = (fonte, codigo, qty, mult, depth, fallback) => {
      if (depth > 10) return;
      if (fonte === 'PRÓPRIA'){ const p = Bases.propMap.get(ckey(codigo)); if (!p) return add(fonte, fallback, qty, mult);
        for (const i of p.itens) explode(fonteKey(i.fonte), i.codigo, qty * (+i.coef || 0), mult, depth + 1, { t:i.tipo, c:i.codigo, d:i.descricao, u:i.unidade }); return; }
      const b = Bases.data[ctx.bases[fonte]]; const r = b && Bases.find(b, codigo);
      if (!r){ return add(fonte, fallback, qty, mult); }
      if (r.t === 'I') return add(fonte, r, qty, mult);
      const comp = b.A.get(ckey(r.c));
      if (!comp || !comp.length){ semAnal++; return add(fonte, r, qty, mult); }
      for (const c of comp){ const rr = c.t === 'I' ? b.I.get(c.k) : b.C.get(c.k); if (rr) explode(fonte, rr.c, qty * c.coef, mult, depth + 1, rr); }
    };
    for (const it of Orc.doc.itens){ if (it.tipo !== 'item') continue;
      const mult = 1 + it._bdi;
      if (it.manual || it.fonte === 'MANUAL'){ const k = 'M|' + it.id; m.set(k, { fonte:it.fonteLabel || it.fonte, codigo:it.codigo, descricao:it.descricao, unidade:it.unidade, qtd:+it.qtd, pu:it._pu, total:it._tot, tipo:'Serviço (preço fixo)' }); continue; }
      explode(it.fonte, it.codigo, +it.qtd || 0, mult, 0, { t:'C', c:it.codigo, d:it.descricao, u:it.unidade }); }
    const res = this.classify([...m.values()].map(x => ({ ...x, total:r2(x.total) }))); res.semAnal = semAnal; return res;
  },
  classify(arr){
    arr.sort((a, b) => b.total - a.total); const tot = arr.reduce((s, x) => s + x.total, 0) || 1; let ac = 0;
    for (const x of arr){ x.pct = x.total / tot; const antes = ac; ac += x.pct; x.acum = ac; x.cls = antes < 0.8 ? 'A' : antes < 0.95 ? 'B' : 'C'; }
    arr.total = tot; return arr;
  },
  render(s){
    Orc.calc(); const d = this.modo === 'serv' ? this.servicos() : this.insumos();
    const cnt = { A:0, B:0, C:0 }, val = { A:0, B:0, C:0 }; d.forEach(x => { cnt[x.cls]++; val[x.cls] += x.total; });
    const anyA = Object.values(Orc.doc.bases).some(id => Bases.data[id]?.A.size);
    s.innerHTML = `<div class="row" style="margin-bottom:10px"><div class="subnav" style="margin:0;border:0"><button data-m="serv" class="${this.modo === 'serv' ? 'on' : ''}">Curva ABC de serviços</button><button data-m="ins" class="${this.modo === 'ins' ? 'on' : ''}">Curva ABC de insumos</button></div><div class="grow"></div>
      <button class="btn" id="abc-xls">Exportar Excel</button><button class="btn" id="abc-pdf">Imprimir / PDF</button></div>
      ${this.modo === 'ins' && d.semAnal ? `<div class="note" style="margin-bottom:10px">${d.semAnal} composição(ões) não têm analítico na base (ex.: ORSE ou bases importadas sem o analítico) e aparecem inteiras em vez de abertas em insumos.</div>` : ''}
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${['A', 'B', 'C'].map(c => `<div class="kpi ${'abc' + c}"><span>Classe ${c} — ${cnt[c]} itens (${fp(cnt[c] / (d.length || 1))} dos itens)</span><b>R$ ${fm(val[c])} · ${fp(val[c] / d.total)}</b></div>`).join('')}</div>
      <div class="plan-wrap"><table class="t"><thead><tr><th>#</th><th>Fonte</th><th>Código</th><th>Descrição</th>${this.modo === 'ins' ? '<th>Tipo</th>' : ''}<th>Und</th><th class="n">Quant.</th><th class="n">Preço unit.</th><th class="n">Total</th><th class="n">%</th><th class="n">% acum.</th><th>Classe</th></tr></thead>
      <tbody>${d.map((x, i) => `<tr class="abc${x.cls}"><td>${i + 1}</td><td><span class="tag ${tagCls(x.fonte)}">${esc(x.fonte)}</span></td><td class="code">${esc(x.codigo)}</td><td>${esc(x.descricao)}</td>${this.modo === 'ins' ? `<td class="small">${esc(x.tipo || '')}</td>` : ''}<td>${esc(x.unidade)}</td><td class="n">${fq(r2(x.qtd * 10000) / 10000)}</td><td class="n">${fm(x.pu)}</td><td class="n">${fm(x.total)}</td><td class="n">${fp(x.pct)}</td><td class="n">${fp(x.acum)}</td><td><b>${x.cls}</b></td></tr>`).join('')}</tbody></table></div>`;
    $$('[data-m]', s).forEach(b => b.onclick = () => { this.modo = b.dataset.m; this.render(s); });
    $('#abc-xls').onclick = () => Rel.xlsABC(this.modo, d); $('#abc-pdf').onclick = () => Rel.printABC(this.modo, d);
  },
};
function tipoInsumo(r){ const d = norm(r.d), u = norm(r.u);
  if (/HORISTA|MENSALISTA/.test(d) || (/^(H|MES)$/.test(u) && /(PEDREIRO|SERVENTE|ELETRICISTA|ENCANADOR|PINTOR|CARPINTEIRO|ENGENHEIRO|MESTRE|AJUDANTE|OPERADOR|MONTADOR|ARMADOR)/.test(d))) return 'Mão de obra';
  if (/^(CHP|CHI)$/.test(u) || /DEPRECIA|LOCACAO|ALUGUEL/.test(d)) return 'Equipamento';
  return r.t === 'C' ? 'Composição (sem analítico)' : 'Material'; }

/* ---------- Cronograma ---------- */
const Crono = {
  etapas(){ return Orc.doc.itens.filter(i => i.tipo === 'etapa' && i.nivel === 1); },
  render(s){
    Orc.calc(); const c = Orc.doc.crono; const n = c.meses; const ets = this.etapas(); const tot = Orc.doc.resumo.total || 1;
    const mesV = Array(n).fill(0);
    const rows = ets.map(e => { const dist = (c.dist[e.id] ||= Array(n).fill(0)); dist.length = n; for (let i = 0; i < n; i++) dist[i] = +dist[i] || 0;
      const soma = dist.reduce((a, b) => a + b, 0); dist.forEach((p, i) => mesV[i] += e._tot * p / 100);
      return `<tr><td><b>${e.num}</b> ${esc(e.titulo)}</td><td class="n">${fm(e._tot)}</td><td class="n">${fp(e._tot / tot)}</td>
        ${dist.map((p, i) => `<td class="n"><input data-e="${e.id}" data-m="${i}" value="${p ? nf2.format(p) : ''}"><div class="small mut">${p ? fm(e._tot * p / 100) : ''}</div></td>`).join('')}
        <td class="n ${Math.abs(soma - 100) > 0.01 ? '' : ''}" style="color:${Math.abs(soma - 100) > 0.01 ? 'var(--red)' : 'var(--g7)'}"><b>${nf2.format(soma)}%</b></td><td><button class="btn sm" data-eq="${e.id}">Igual</button></td></tr>`; }).join('');
    let ac = 0; const acum = mesV.map(v => (ac += v));

function extenso(v){
  const U = ['', 'UM', 'DOIS', 'TRÊS', 'QUATRO', 'CINCO', 'SEIS', 'SETE', 'OITO', 'NOVE', 'DEZ', 'ONZE', 'DOZE', 'TREZE', 'QUATORZE', 'QUINZE', 'DEZESSEIS', 'DEZESSETE', 'DEZOITO', 'DEZENOVE'];
  const D = ['', '', 'VINTE', 'TRINTA', 'QUARENTA', 'CINQUENTA', 'SESSENTA', 'SETENTA', 'OITENTA', 'NOVENTA'];
  const C = ['', 'CENTO', 'DUZENTOS', 'TREZENTOS', 'QUATROCENTOS', 'QUINHENTOS', 'SEISCENTOS', 'SETECENTOS', 'OITOCENTOS', 'NOVECENTOS'];
  const ate999 = n => { if (n === 100) return 'CEM'; const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(C[c]); if (r < 20){ if (r) p.push(U[r]); } else { p.push(D[Math.floor(r / 10)] + (r % 10 ? ' E ' + U[r % 10] : '')); } return p.join(' E '); };
  const inteiro = n => { if (n === 0) return 'ZERO'; const grupos = []; while (n > 0){ grupos.push(n % 1000); n = Math.floor(n / 1000); }
    const nomes = [['', ''], ['MIL', 'MIL'], ['MILHÃO', 'MILHÕES'], ['BILHÃO', 'BILHÕES']]; const partes = [];
    for (let i = grupos.length - 1; i >= 0; i--){ const g = grupos[i]; if (!g) continue;
      let t = (i === 1 && g === 1) ? 'MIL' : ate999(g) + (i ? ' ' + nomes[i][g > 1 ? 1 : 0] : ''); partes.push({ t, g, i }); }
    return partes.map((p, k) => { if (k === 0) return p.t; const last = k === partes.length - 1; return ((last && (p.g < 100 || p.g % 100 === 0)) ? ' E ' : ', ') + p.t; }).join(''); };
  v = Math.round((+v || 0) * 100); const re = Math.floor(v / 100), ce = v % 100;
  let s = ''; if (re) s = inteiro(re) + (re % 1000000 === 0 ? ' DE' : '') + (re === 1 ? ' REAL' : ' REAIS');
  if (ce) s += (s ? ' E ' : '') + inteiro(ce) + (ce === 1 ? ' CENTAVO' : ' CENTAVOS');
  return s || 'ZERO REAIS';
}
const GRP_ORD = ['Material', 'Mão de Obra com Encargos Complementares', 'Mão de Obra', 'Equipamento Custo Horário', 'Equipamento', 'Composições Auxiliares'];
function grupoComp(i){ const d = norm(i.descricao), u = norm(i.unidade);
  if (i.tipo === 'C'){ if (/ENCARGOS COMPLEMENTARES/.test(d)) return 'Mão de Obra com Encargos Complementares'; if (/^(CHP|CHI)$/.test(u)) return 'Equipamento Custo Horário'; return 'Composições Auxiliares'; }
  const t = tipoInsumo({ d:i.descricao, u:i.unidade, t:'I' }); return t === 'Mão de obra' ? 'Mão de Obra' : t; }

/* =================== SEOBRA (exportação) ===================
   Formato testado na importação do Seobra (nov/2026): ITEM | CODIGO | FONTE | DESCRICAO | UNIDADE | QUANTIDADE | PRECO UNITARIO (sem BDI) | PRECO TOTAL.
   Etapas = linha só com o número e o título. Itens com quantidade zero ficam de fora (o Seobra não aceita). */
const Seobra = {
  fonte(it){ const f = it.fonte || ''; if (f === 'PRÓPRIA') return 'PRÓPRIO'; return f || 'MANUAL'; },
  linhas(){
    Orc.calc(); const d = Orc.doc; const out = [['ITEM', 'CODIGO', 'FONTE', 'DESCRICAO', 'UNIDADE', 'QUANTIDADE', 'PRECO UNITARIO', 'PRECO TOTAL']];
    let zeros = 0, semCod = 0, manuais = 0, pend = [];
    for (const it of d.itens){
      if (it.tipo === 'etapa'){ pend.push([it.num, '', '', it.titulo, '', '', '', '']); continue; }
      if (!(+it.qtd > 0)){ zeros++; continue; }
      if (pend.length){ out.push(...pend); pend = []; } // etapa vazia não vai
      const f = this.fonte(it); let cod = String(it.codigo || '').trim();
      if (!cod){ cod = 'MAN-' + it.num; semCod++; }
      if (f === 'MANUAL' || it.manual) manuais++;
      out.push([it.num, cod, f, String(it.descricao || '').toUpperCase(), String(it.unidade || '').toUpperCase(), +it.qtd, it._custo, r2(+it.qtd * it._custo)]);
    }
    return { out, zeros, semCod, manuais };
  },
  exportar(){
    if (!window.XLSX) return toast('Biblioteca do Excel não carregou');
    const d = Orc.doc, { out, zeros, semCod, manuais } = this.linhas(), r = d.resumo;
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(out);
    ws['!cols'] = [{ wch:8 }, { wch:12 }, { wch:10 }, { wch:90 }, { wch:8 }, { wch:12 }, { wch:14 }, { wch:14 }];
    for (let i = 1; i < out.length; i++){ for (const c of [6, 7]){ const a = XLSX.utils.encode_cell({ r:i, c }); if (ws[a] && typeof ws[a].v === 'number') ws[a].z = '#,##0.00'; } }
    XLSX.utils.book_append_sheet(wb, ws, 'ORCAMENTO');
    const info = [
      ['DADOS PARA CONFERÊNCIA NO SEOBRA (esta aba não é importada)'], [],
      ['Obra', d.obra || d.nome], ['Referência', Orc.refLabel()], ['BDI global (%)', r2(Orc.bdiN() * 100)],
      ['Custo direto (sem BDI)', r.totalSem], ['Total com BDI', r.total],
      ['Administração da obra (%)', +d.adm || 0], ['Administração da obra (R$, já com BDI)', r.adm],
      ['Desconto (%)', +d.desconto || 0], ['Desconto (R$)', r.desconto], ['Valor total final', r.final], [],
      ['COMO IMPORTAR'],
      ['1', 'Seobra › Orçamentos › Importar Planilha › escolher este arquivo (aba ORCAMENTO).'],
      ['2', 'Informar o BDI global acima e marcar "Salvar itens não encontrados como composições próprias".'],
      ['3', 'Conferir o Resumo/Total por Fontes: o valor total deve bater com o "Custo direto (sem BDI)".'],
      ['4', 'Lançar a administração da obra e o desconto em Acréscimos/Descontos (não entram pela importação).'],
      [], ['Itens com quantidade zero não exportados', zeros], ['Itens sem código (receberam MAN-<item>)', semCod], ['Itens com preço fixo/cotação (entram como composição própria)', manuais],
    ];
    const wi = XLSX.utils.aoa_to_sheet(info); wi['!cols'] = [{ wch:48 }, { wch:90 }];
    XLSX.utils.book_append_sheet(wb, wi, 'LEIA-ME');
    const nome = ('SEOBRA_' + (d.nome || 'orcamento')).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9_-]+/g, '_').slice(0, 80) + '.xlsx';
    XLSX.writeFile(wb, nome);
    toast(`Exportado para o Seobra: ${out.length - 1} linhas${zeros ? ` · ${zeros} itens com quantidade zero ficaram de fora` : ''}`, 5000);
  },
};

const Importer = {
  pick(accept, cb){ const fi = $('#file-in'); fi.value = ''; fi.accept = accept; fi.onchange = () => fi.files[0] && cb(fi.files[0]); fi.click(); },
  async readBook(file){ if (!window.XLSX) throw new Error('Biblioteca do Excel não carregou'); const buf = await file.arrayBuffer(); return XLSX.read(buf, { type:'array' }); },
  aoa(wb, name){ return XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null, blankrows:false }); },
  /* ---- orçamento (formato OrçaFascio / similar) ---- */
  pickOrc(){ this.pick('.xlsx,.xls,.csv', f => this.importOrc(f).catch(e => toast('Erro: ' + e.message, 6000))); },
  async importOrc(file){
    const wb = await this.readBook(file); let rows = null, hi = -1;
    const isHdr = r => r && r.some(c => /^I?TEM$/.test(norm(c).trim())) && r.some(c => /DESCRI/.test(norm(c))) && r.some(c => /QUANT/.test(norm(c)));
    const cand = [...wb.SheetNames].sort((a, b) => (/PLAN|ORCAMENT/.test(norm(b)) ? 1 : 0) - (/PLAN|ORCAMENT/.test(norm(a)) ? 1 : 0));
    for (const sn of cand){ const rr = this.aoa(wb, sn); const h = rr.findIndex(isHdr); if (h >= 0){ rows = rr; hi = h; break; } }
    if (hi < 0) throw new Error('Não encontrei a linha de cabeçalho (ITEM / DESCRIÇÃO / QUANT.) em nenhuma aba');
    const H = rows[hi].map(c => norm(c).replace(/\s+/g, ' ').trim());
    const col = re => H.findIndex(h => re.test(h));
    const C = { item:col(/^I?TEM$/), cod:col(/CODIGO/), desc:col(/DESCRI/), fonte:col(/FONTE|BANCO/), und:col(/^UN/), qtd:col(/QUANT/), psb:col(/S\/ ?BDI|SEM BDI/), pu:col(/UNITARIO|UNIT/), tot:col(/TOTAL/) };
    if (C.psb < 0){ const uc = H.map((h, i) => /UNIT/.test(h) ? i : -1).filter(i => i >= 0);
      const sem = uc.find(i => !/BDI/.test(H[i])), com = uc.find(i => /C\/ ?BDI|COM BDI/.test(H[i]));
      if (sem != null && com != null) C.psb = sem; } // ex.: Seobra "Valor Unit" + "Valor Unit com BDI"
    if (C.psb >= 0) C.pu = C.psb;
    let bdiTot = null, orcTot = null, bdiCel = null, descPct = 0;
    const desFile = rows.slice(0, hi + 1).some(r => r.some(c => /COM DESONERA/.test(norm(c))));
    const refCel = rows.slice(0, hi).flat().find(c => /REF\.?:/.test(norm(c)) && /SINAPI|ORSE|TABELA/.test(norm(c)));
    for (const r of rows.slice(0, hi)){ const k = r.findIndex(c => /^BDI:?$/.test(norm(c).trim())); if (k >= 0){ const v = r.slice(k + 1).find(c => typeof c === 'number'); if (v != null) bdiCel = v; } }
    for (const r of rows.slice(hi + 1)){ const t = r.map(c => norm(c)).join('|'); const val = r.filter(c => typeof c === 'number').pop();
      if (/VALOR BDI/.test(t)) bdiTot = val; else if (/VALOR ORCAMENTO|VALOR SEM BDI|CUSTO DIRETO/.test(t)) orcTot = val;
      else if (/DESCONTO/.test(t)){ const p = r.filter(c => typeof c === 'number' && c > 0 && c < 1)[0]; if (p) descPct = r2(p * 100); } }
    const precoSemBdi = C.psb >= 0; const bdiDet = precoSemBdi ? 0 : (bdiTot && orcTot ? bdiTot / orcTot : 0);
    const bdiAdot = bdiCel != null ? (bdiCel > 1 ? bdiCel / 100 : bdiCel) : (precoSemBdi ? 0 : bdiDet);
    const d = novoOrc(); d.nome = file.name.replace(/\.[^.]+$/, ''); let nI = 0;
    const { comps:compsArq, sheet:compSheet } = this.compsFromBook(wb);
    for (const r of rows.slice(hi + 1)){
      const item = r[C.item] == null ? '' : String(r[C.item]).trim(); const desc = String(r[C.desc] ?? '').trim();
      const fonte = C.fonte >= 0 ? String(r[C.fonte] ?? '').trim() : ''; const cod = C.cod >= 0 ? String(r[C.cod] ?? '').trim() : '';
      if (/^VALOR/.test(norm(item))) continue;
      if (!item && !(fonte && desc && String(r[C.qtd] ?? '').trim() !== '')) continue;
      if (!fonte && !(C.qtd >= 0 && String(r[C.qtd] ?? '').trim() !== '' && cod)){
        const tit = desc || r.slice(C.item + 1).find(c => typeof c === 'string' && c.trim() && isNaN(parseNum(c)));
        if (tit) d.itens.push({ id:uid(), tipo:'etapa', nivel:Math.min(3, String(item || '1').split('.').length), titulo:String(tit).trim().toUpperCase() }); continue; }
      if (!desc) continue;
      const fk = fonteKey(fonte) || 'MANUAL'; const pu = parseNum(r[C.pu]);
      d.itens.push({ id:uid(), tipo:'item', fonte:fk, fonteLabel:fk === 'PRÓPRIA' ? 'PRÓPRIA' : undefined, codigo:cod, descricao:desc, unidade:String(r[C.und] ?? '').trim().toUpperCase(), qtd:parseNum(r[C.qtd]) || 0, qexpr:'', custo:isNaN(pu) ? 0 : pu, puArq:pu, manual:true, importado:true, bdiDif:false });
      nI++;
    }
    UI.modal(`<h2>Importar orçamento</h2><p><b>${esc(file.name)}</b>: ${d.itens.length - nI} etapas e ${nI} itens encontrados.</p>
      <p class="small mut">A taxa de administração da obra começa em 0% no orçamento importado (a planilha original já traz a administração local como item). Ajuste em Dados e BDI se precisar.</p><div class="grid g2"><div><label class="l">Nome do orçamento</label><input class="f" id="io-n" value="${esc(d.nome)}"></div>
      <div><label class="l">BDI embutido nos preços do arquivo (%)</label><input class="f" id="io-b" value="${nf2.format(bdiDet * 100)}"><div class="small mut">${precoSemBdi ? 'A planilha tem a coluna “PREÇO S/BDI”: os custos entram sem BDI.' : bdiDet ? 'Calculado pelo “Valor BDI / Valor orçamento” do rodapé.' : 'Não encontrei no rodapé; informe se os preços do arquivo já têm BDI.'}</div></div>
      <div><label class="l">BDI do orçamento (%)</label><input class="f" id="io-ba" value="${nf2.format(bdiAdot * 100)}"></div><div><label class="l">Desconto (%)</label><input class="f" id="io-d" value="${nf2.format(descPct)}"></div></div>
      <div style="margin-top:12px"><label class="chk"><input type="checkbox" id="io-ref"> <b>Guardar como orçamento de referência</b> (modelo; mantém os preços originais da planilha)</label>
      ${compsArq.length ? `<label class="chk" style="margin-top:6px"><input type="checkbox" id="io-cp" checked> Importar também as <b>${compsArq.length} composições próprias</b> da aba ${esc(compSheet)} (${compsArq.map(c => esc(c.codigo)).join(', ')})</label>` : ''}</div>
      <div style="margin-top:12px"><label class="chk"><input type="radio" name="io-m" value="base" checked> Usar os preços da base atual (SINAPI-MT 09/2026) nos itens encontrados; os demais mantêm o preço do arquivo</label>
      <label class="chk" style="margin-top:6px"><input type="radio" name="io-m" value="arq"> Manter todos os preços do arquivo (preço fixo)</label></div>
      <div class="ft"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn pri" id="io-ok">Importar</button></div>`);
    $('#io-n').oninput = e => e.target.dataset.edited = '1';
    $('#io-ref').onchange = e => { if (e.target.checked) $('input[name=io-m][value=arq]').checked = true; };
    $('#io-ok').onclick = async () => {
      const bdi = (parseNum($('#io-b').value) || 0) / 100; const usaBase = $$('input[name=io-m]').find(x => x.checked).value === 'base';
      d.referencia = $('#io-ref').checked; let nCp = 0; if (refCel) d.refTexto = String(refCel).replace(/^\s*REF\.?:\s*/i, '').trim();
      if (compsArq.length && $('#io-cp')?.checked){ $('#io-ok').disabled = true; $('#io-ok').textContent = 'Importando composições…';
        try { nCp = await this.saveComps(compsArq, d.nome); } catch(e){ toast('Erro ao salvar composições: ' + e.message, 6000); } }
      d.nome = $('#io-n').value.trim() || d.nome; d.obra = d.nome; d.adm = 0; d.desconto = parseNum($('#io-d').value) || 0; if (desFile) d.des = true;
      const ba = parseNum($('#io-ba').value); if (ba > 0){ d.bdi.fixoOn = true; d.bdi.fixo = r2(ba); }
      for (const [lab, key] of [['OBRA', 'obra'], ['ENDERECO', 'endereco'], ['MUNICIPIO', 'municipio'], ['ASSUNTO', 'assunto'], ['ORDEM DE SERVICO', 'os']]){
        for (const r of rows.slice(0, hi)){ const k = r.findIndex(c => norm(c).trim().replace(/:$/, '') === lab); if (k >= 0){ const v = r.slice(k + 1).find(c => c != null && String(c).trim()); if (v) d[key] = String(v).trim(); } } }
      if (d.obra && d.obra !== d.nome && !$('#io-n').dataset.edited) d.nome = d.obra;
      let found = 0, nf = 0; const ctx = { bases:d.bases, des:d.des };

const Hist = {

  apply(s){ this.busy = true; const keep = { id:Orc.doc.id }; const pos = Math.max(0, Orc.idx(Orc.lastSel));
