    const k = (keys, t) => `<div><span>${t}</span><span>${keys.split(' + ').map(x => `<kbd>${x}</kbd>`).join(' ')}</span></div>`;
    UI.modal(`<h2>Atalhos de teclado</h2><div class="keys">
      <h3>Geral</h3>${k('Ctrl + K', 'Paleta de comandos')}${k('?', 'Esta lista')}${k('Alt + 1/2/3', 'Orçamentos / Composições / Bancos')}${k('Ctrl + S', 'Salvar')}${k('Ctrl + Shift + L', 'Alternar tema claro/escuro')}${k('Esc', 'Fechar janela / painel')}
      <h3>Orçamento aberto</h3>${k('Alt + 1…6', 'Dados · Planilha · ABC · Cronograma · Medição · Relatórios')}${k('Ctrl + Z', 'Desfazer')}${k('Ctrl + Y', 'Refazer')}${k('Ctrl + Shift + S', 'Exportar para o Seobra')}${k('Ctrl + P', 'Ir para Relatórios')}
      <h3>Planilha</h3>${k('↑ / ↓', 'Linha anterior / próxima')}${k('Shift + ↑ / ↓', 'Estender seleção')}${k('Home / End', 'Primeira / última linha')}${k('Ctrl + A', 'Selecionar tudo')}
      ${k('Enter', 'Editar quantidade (etapa: título)')}${k('F2', 'Editar item / etapa')}${k('F4', 'Memória de cálculo do item')}${k('Insert', 'Inserir item (busca)')}
      ${k('Ctrl + E', 'Nova etapa')}${k('Ctrl + Shift + E', 'Nova subetapa')}${k('Alt + ↑ / ↓', 'Mover linhas')}${k('Tab / Shift + Tab', 'Nível da etapa')}
      ${k('Ctrl + D', 'Duplicar linhas')}${k('Delete', 'Excluir linhas')}${k('Ctrl + C', 'Copiar linhas (cola no Excel)')}${k('Ctrl + V', 'Colar código + quantidade do Excel')}${k('Ctrl + F', 'Filtrar na planilha')}
      <h3>Quantidade e busca</h3>${k('Enter', 'Confirma e vai para a próxima')}${k('Esc', 'Cancela a edição')}${k('↑ / ↓ + Enter', 'Na busca: escolher e inserir')}${k('Ctrl + Enter', 'Na busca: inserir e continuar buscando')}
      </div><div class="ft"><button class="btn pri" onclick="UI.closeModal()">Fechar</button></div>`, true);
  },
  decorate(){ // dicas de teclado nos botões
    const hint = (sel, k) => { const b = $(sel); if (b && !b.querySelector('kbd')) b.insertAdjacentHTML('beforeend', `<kbd>${k}</kbd>`); };
    hint('#t-add', 'Ins'); hint('#t-et', 'Ctrl E'); hint('#t-seobra', 'Ctrl ⇧ S');
    $$('.subnav button[data-s]').forEach((b, i) => { if (!b.querySelector('.k')) b.insertAdjacentHTML('beforeend', `<span class="k">Alt ${i + 1}</span>`); });
    const tb = $('#plan tbody'); if (tb && !tb._kb){ tb._kb = true;
      tb.addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; if (!e.shiftKey) this.anchor = tr.dataset.id; this.paint(); });
      tb.addEventListener('focusin', e => { const id = e.target.dataset?.q; if (id){ Orc.sel = new Set([id]); Orc.lastSel = id; this.anchor = id; this.paint(); } });
      tb.addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.dataset?.q){ const it = Orc.doc.itens[Orc.idx(e.target.dataset.q)]; e.target.value = it.qexpr || fq(it.qtd); e.stopPropagation(); e.target.blur(); }
        if ((e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter') && e.target.dataset?.q){ e.preventDefault(); e.stopImmediatePropagation();
          const ins = $$('input.q', tb); const i = ins.indexOf(e.target); const n = ins[i + (e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey) ? -1 : 1)]; const nid = n?.dataset.q;
          e.target.dispatchEvent(new Event('change', { bubbles:true }));
          setTimeout(() => { const m = nid && $(`#plan input.q[data-q="${nid}"]`); if (m){ m.focus(); m.select(); } }, 0); } }, true);
    }
    this.paint(); this.fit();
  },
  key(e){
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && (k === 'k' || k === 'K')){ e.preventDefault(); Pal.open(); return; }
    if (this.overlay()) return;
    if (ctrl && e.shiftKey && (k === 'L' || k === 'l')){ e.preventDefault(); Theme.toggle(); return; }
    if (this.typing(e)) return;
    if (k === '?' ){ e.preventDefault(); this.help(); return; }
    if (e.altKey && /^[1-6]$/.test(k)){ e.preventDefault(); const n = +k;
      if (UI.view === 'orc'){ const s = ['dados', 'plan', 'abc', 'crono', 'med', 'rel'][n - 1]; UI.sub = s; UI.renderOrc($('#view')); }
      else if (n <= 3) $$('#nav button')[n - 1]?.click(); return; }
    if (UI.view === 'orc' && Orc.doc){
      if (ctrl && !e.shiftKey && (k === 'z' || k === 'Z')){ e.preventDefault(); Hist.undo(); return; }
      if (ctrl && (k === 'y' || k === 'Y' || (e.shiftKey && (k === 'z' || k === 'Z')))){ e.preventDefault(); Hist.redo(); return; }
      if (ctrl && e.shiftKey && (k === 'S' || k === 's')){ e.preventDefault(); e.stopImmediatePropagation(); Seobra.exportar(); return; }
      if (ctrl && (k === 'p' || k === 'P')){ e.preventDefault(); UI.sub = 'rel'; UI.renderOrc($('#view')); return; }
    }
    if (!this.inPlan() || $('#drawer').classList.contains('open')) return;
    const id = this.cur();
    if (k === 'ArrowDown' || k === 'ArrowUp'){
      if (e.altKey){ e.preventDefault(); if (!Orc.sel.size) return; Orc.move(k === 'ArrowDown' ? 1 : -1); this.refresh(); this.reveal(id); return; }
      e.preventDefault(); this.step(k === 'ArrowDown' ? 1 : -1, e.shiftKey); return; }
    if (k === 'PageDown' || k === 'PageUp'){ e.preventDefault(); this.step(k === 'PageDown' ? 15 : -15, e.shiftKey); return; }
    if (k === 'Home' || k === 'End'){ e.preventDefault(); const rows = this.rows(); if (rows.length) this.select(rows[k === 'Home' ? 0 : rows.length - 1].dataset.id, e.shiftKey); return; }
    if (ctrl && (k === 'a' || k === 'A')){ e.preventDefault(); Orc.sel = new Set(this.rows().map(r => r.dataset.id)); this.paint(); return; }
    if (ctrl && (k === 'd' || k === 'D')){ e.preventDefault(); this.dup(); return; }
    if (ctrl && (k === 'f' || k === 'F')){ e.preventDefault(); $('#t-flt')?.focus(); $('#t-flt')?.select(); return; }
    if (ctrl && (k === 'e' || k === 'E')){ e.preventDefault(); $(e.shiftKey ? '#t-sub' : '#t-et')?.click(); return; }
    if (k === 'Tab' && [...Orc.sel].some(x => Orc.doc.itens[Orc.idx(x)]?.tipo === 'etapa')){ e.preventDefault(); Orc.indent(e.shiftKey ? -1 : 1); this.refresh(); return; }
    if (!id) return;
    const it = Orc.doc.itens[Orc.idx(id)];
    if (k === 'Enter'){ e.preventDefault(); if (it.tipo === 'etapa') Plan.edit(id); else this.focusQty(id); return; }
    if (k === 'F2'){ e.preventDefault(); Plan.edit(id); return; }
    if (k === 'F4' && it.tipo !== 'etapa'){ e.preventDefault(); Plan.edit(id); setTimeout(() => { const m = $('#i-mem'); if (m){ m.focus(); m.scrollIntoView({ block:'center' }); } }, 60); return; }
  },
};
document.addEventListener('keydown', e => Kb.key(e));
window.addEventListener('resize', debounce(() => Kb.fit(), 120));
document.addEventListener('copy', e => { if (Kb.inPlan() && !Kb.typing(e) && !Kb.overlay() && window.getSelection().isCollapsed) Kb.copy(e); });
document.addEventListener('paste', e => { if (!Kb.inPlan() || Kb.typing(e) || Kb.overlay() || $('#drawer').classList.contains('open')) return;
  const t = e.clipboardData.getData('text/plain'); if (t){ e.preventDefault(); Kb.paste(t); } });

/* busca de itens (drawer) pelo teclado */
(() => {
  const q = $('#dr-q'); let on = -1;
  const list = () => $$('#dr-res .res');
  const mark = i => { const L = list(); if (!L.length) return; on = Math.max(0, Math.min(L.length - 1, i)); L.forEach((x, j) => x.classList.toggle('on', j === on)); const el = L[on], box = $('#dr-res'); if (el.offsetTop < box.scrollTop) box.scrollTop = el.offsetTop; else if (el.offsetTop + el.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = el.offsetTop + el.offsetHeight - box.clientHeight; };
  new MutationObserver(() => { on = -1; if (list().length) mark(0); }).observe($('#dr-res'), { childList:true });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); mark(on + (e.key === 'ArrowDown' ? 1 : -1)); }
    else if (e.key === 'Enter'){ const el = list()[on]; if (!el) return; e.preventDefault(); el.click();
      if (!(e.ctrlKey || e.metaKey)){ UI.closeDrawer(); if (Kb.inPlan()){ const id = [...Orc.sel][0]; setTimeout(() => { Orc.lastSel = id; Kb.paint(); Kb.focusQty(id); }, 30); } }
      else { q.select(); } }
  });
  q.placeholder = 'Código ou descrição — ↑↓ escolhe, Enter insere, Ctrl+Enter insere e continua';
})();

/* paleta de comandos (Ctrl+K) */
const Pal = {
  items:[], on:0, orcs:null,
  cmds(){
    const C = [], add = (g, t, s, fn, kb='') => C.push({ g, t, s, fn, kb });
    add('Ir para', 'Orçamentos', 'lista de orçamentos', () => UI.go('orcs'), 'Alt 1');
    add('Ir para', 'Composições próprias', '', () => UI.go('proprias'), 'Alt 2');
    add('Ir para', 'Bancos de preços', 'SINAPI, ORSE e bases importadas', () => UI.go('bases'), 'Alt 3');
    if (Orc.doc && UI.view === 'orc'){
      [['dados', 'Dados e BDI'], ['plan', 'Planilha'], ['abc', 'Curva ABC'], ['crono', 'Cronograma'], ['med', 'Medição'], ['rel', 'Relatórios']].forEach(([s, t], i) => add('Orçamento aberto', t, Orc.doc.nome, () => { UI.sub = s; UI.renderOrc($('#view')); }, 'Alt ' + (i + 1)));
      const pl = fn => () => { if (UI.sub !== 'plan'){ UI.sub = 'plan'; UI.renderOrc($('#view')); } setTimeout(fn, 20); };
      add('Ações', 'Inserir item da base', 'SINAPI / ORSE / própria', pl(() => $('#t-add').click()), 'Ins');
      add('Ações', 'Nova etapa', '', pl(() => $('#t-et').click()), 'Ctrl E');
      add('Ações', 'Nova subetapa', '', pl(() => $('#t-sub').click()), 'Ctrl ⇧ E');
      add('Ações', 'Exportar para o Seobra', '.xlsx no formato da importação', () => Seobra.exportar(), 'Ctrl ⇧ S');
      add('Ações', 'Gerar relatórios (Excel / PDF)', '', () => { UI.sub = 'rel'; UI.renderOrc($('#view')); }, 'Ctrl P');
      add('Ações', 'Salvar agora', '', () => Orc.save(), 'Ctrl S');
      add('Ações', 'Desfazer', `${Hist.u.length} passo(s)`, () => Hist.undo(), 'Ctrl Z');
      add('Ações', 'Refazer', `${Hist.r.length} passo(s)`, () => Hist.redo(), 'Ctrl Y');
      add('Ações', 'Usar preços da base nos itens importados', '', pl(() => $('#t-reprice').click()));
    } else if (UI.view === 'orcs'){
      add('Ações', 'Novo orçamento', '', () => $('#new-orc')?.click());
      add('Ações', 'Novo pelo modelo SMS', '', () => $('#new-mod')?.click());
      add('Ações', 'Importar planilha (.xlsx)', 'OrçaFascio, Seobra, PASSAREDO…', () => Importer.pickOrc());
    }
    add('Preferências', Theme.get() === 'dark' ? 'Tema claro' : 'Tema escuro', '', () => Theme.toggle(), 'Ctrl ⇧ L');
    add('Preferências', 'Atalhos de teclado', '', () => Kb.help(), '?');
    return C;
  },
  async open(){ $('#pal-bg').classList.add('open'); const q = $('#pal-q'); q.value = ''; q.focus(); this.render();
    try { this.orcs = await Store.listOrcs(); this.render(); } catch(e){} },
  close(){ $('#pal-bg').classList.remove('open'); },
  render(){
    const q = norm($('#pal-q').value).trim(), toks = q.split(/\s+/).filter(Boolean), m = s => toks.every(t => norm(s).includes(t));
    let L = this.cmds().filter(c => m(c.t + ' ' + c.s + ' ' + c.g));
    for (const o of (this.orcs || [])) if (m(o.nome) && (toks.length || L.length < 12)) L.push({ g:'Abrir orçamento', t:o.nome, s:'R$ ' + fm(o.resumo?.final ?? o.resumo?.total), fn:async () => { if (Orc.dirty) await Orc.save(); await Orc.open(o.id); UI.sub = 'plan'; UI.go('orc'); } });
    if (Orc.doc && UI.view === 'orc' && q.length >= 2){ let n = 0;
      for (const it of Orc.doc.itens){ const txt = it.tipo === 'etapa' ? it.titulo : it.descricao + ' ' + it.codigo;
        if (m(it.num + ' ' + txt) && n++ < 40) L.push({ g:'Ir para linha da planilha', t:`${it.num}  ${it.tipo === 'etapa' ? it.titulo : it.descricao}`, s:it.tipo === 'etapa' ? 'etapa · R$ ' + fm(it._tot) : `${it.codigo} · ${fq(it.qtd)} ${it.unidade} · R$ ${fm(it._tot)}`,
          fn:() => { Plan.filter = ''; UI.sub = 'plan'; UI.renderOrc($('#view')); setTimeout(() => { Kb.select(it.id); }, 20); } }); } }
    L = L.slice(0, 80); this.items = L; this.on = 0; let g = '';
    $('#pal-list').innerHTML = L.map((c, i) => `${c.g !== g ? `<div class="pal-g">${esc(g = c.g)}</div>` : ''}<div class="pal-i" data-i="${i}"><span class="t">${esc(c.t)}</span><span class="s">${esc(c.s || '')}</span>${c.kb ? `<kbd>${c.kb}</kbd>` : ''}</div>`).join('') || `<div class="empty">Nada encontrado</div>`;
    $$('#pal-list .pal-i').forEach(el => { el.onmousemove = () => this.mark(+el.dataset.i, false); el.onclick = () => this.run(+el.dataset.i); });
    this.mark(0);
  },
  mark(i, scroll=true){ const L = $$('#pal-list .pal-i'); if (!L.length) return; this.on = (i + L.length) % L.length; L.forEach((x, j) => x.classList.toggle('on', j === this.on)); scroll && L[this.on].scrollIntoView({ block:'nearest' }); },
  run(i){ const c = this.items[i]; if (!c) return; this.close(); try { const r = c.fn(); r && r.catch && r.catch(e => toast(e.message)); } catch(e){ toast(e.message); } },
};
$('#pal-q').addEventListener('input', debounce(() => Pal.render(), 60));
$('#pal-q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); Pal.mark(Pal.on + (e.key === 'ArrowDown' ? 1 : -1)); }
  else if (e.key === 'Enter'){ e.preventDefault(); Pal.run(Pal.on); }
  else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); Pal.close(); } });
$('#pal-bg').addEventListener('mousedown', e => { if (e.target.id === 'pal-bg') Pal.close(); });
$('#sb-pal').onclick = () => Pal.open(); $('#sb-keys').onclick = () => Kb.help(); $('#sb-theme').onclick = () => Theme.toggle(); Theme.set(Theme.get());

/* =================== INÍCIO =================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modal-bg').classList.contains('open')) UI.closeModal(); else UI.closeDrawer(); }
  if (UI.view === 'orc' && UI.sub === 'plan' && !e.target.matches('input,textarea,select')){
    if (e.key === 'Delete') $('#t-del')?.click();
    if (e.key === 'Insert' || (e.key === 'i' && (e.ctrlKey || e.metaKey))){ e.preventDefault(); $('#t-add')?.click(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && UI.view === 'orc'){ e.preventDefault(); Orc.save(); }
});
$('#modal-bg').addEventListener('mousedown', e => { if (e.target.id === 'modal-bg') UI.closeModal(); });
$$('#nav button').forEach(b => b.onclick = async () => { if (UI.view === 'orc' && Orc.dirty) await Orc.save(); UI.go(b.dataset.v); });
window.addEventListener('beforeunload', e => { if (Orc.dirty){ Orc.save(); e.preventDefault(); e.returnValue = ''; } });
(async () => {
  $('#view').innerHTML = '<div class="empty">Carregando bases de preços…</div>';
  await Store.init();
  await Bases.init();
  if (window.CTOSM) CTOSM.bar('orc');
  UI.go('orcs');
  const orcParam = window.CTOSM && CTOSM.param('orc');
  if (orcParam){ try { await Orc.open(orcParam); UI.sub = 'plan'; UI.go('orc'); } catch(e){ toast('Orçamento do link não encontrado'); } }
})();
</script>
